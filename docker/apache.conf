# PromoClock vhost. ${PORT} comes from the container environment.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:${PORT}>
    # Behind Caddy/Cloudflare TLS: self-referential redirects (e.g. /en → /en/) use https.
    ServerName https://promoclock.co
    UseCanonicalName Off
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel warn
</VirtualHost>
