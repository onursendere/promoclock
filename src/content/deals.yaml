# Deals, promotions and limit changes. Times are UTC (ISO 8601).
# Every entry needs an official or reputable source and the date it was last verified.
# Status (live / upcoming / ended) is derived from startsAt/endsAt — never set by hand.

- id: claude-code-weekly-plus25-permanent
  tool: claude
  kind: limit-change
  featured: true
  title:
    en: "Claude Code weekly limits are now permanently +25% — the +50% boost has ended"
  summary:
    en: "From September 14, 2026, standard Claude Code weekly limits are permanently 25% above the pre-promotion baseline for Pro, Max, Team and seat-based Enterprise plans. The temporary +50% boost ended at the same time, so active users have about 17% less weekly capacity than during the promo (150 → 125 on a 100 baseline). Five-hour limits are unchanged."
  scope:
    en: "Claude Code · Pro, Max, Team, seat-based Enterprise"
  startsAt: 2026-09-14T00:00:00Z
  verifiedAt: 2026-09-16T00:00:00Z
  sourceUrl: https://x.com/ClaudeDevs/status/2093742321473065266
  sourceLabel: "@ClaudeDevs on X (Aug 29, 2026)"

- id: claude-code-weekly-plus50-2026
  tool: claude
  kind: limit-boost
  title:
    en: "Claude Code weekly limits boosted +50%"
  summary:
    en: "Anthropic raised Claude Code weekly limits by 50% for Pro, Max, Team and seat-based Enterprise plans, applied automatically across the CLI, IDE extensions, desktop and web. Originally scheduled to end July 13, 2026, it was extended and replaced on September 14, 2026 by a permanent +25% increase."
  scope:
    en: "Claude Code · Pro, Max, Team, seat-based Enterprise"
  startsAt: 2026-05-13T00:00:00Z
  endsAt: 2026-09-14T00:00:00Z
