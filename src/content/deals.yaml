# Fields: title (page H1, search-friendly) · headline (card, ≤ 60 chars) · value (the offer in
# a few words) · audience (who) · summary (answer-first, 1–2 sentences) · steps · terms.
# Only write facts the source supports. When only the deadline is known, set startKnown: false
# and use the first-seen date as startsAt.

